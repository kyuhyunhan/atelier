# Authoritative PR gate — the layer `git commit --no-verify` cannot bypass.
#
# The pre-commit PII guard and the test suite are enforced locally by hooks and
# by discipline, but both degraded in one goal-workflow run: an agent used
# `--no-verify`, and a self-review merged. A hook a committer can skip and a
# review an author can self-serve are not gates. This job re-runs both over the
# PR diff on GitHub, where no local flag reaches — so branch protection can
# require it and a self-merge or a bypassed guard cannot land on main.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test-and-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # full history so the PII guard can diff the range

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Test suite (embeddings off — deterministic, no model download)
        run: ATELIER_EMBED=off python -m pytest -q

      - name: PII guard over the PR diff
        # Layer 2 of scripts/git-hooks/pre-commit, run authoritatively. The
        # pattern file is per-machine and absent in CI, so this enforces the
        # STRUCTURAL half (no bulk/large export) — the half that protects a
        # public repo regardless of any user config, and the half `--no-verify`
        # was used to skip.
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          range="${base:+$base..$head}"
          max="${ATELIER_MAX_STAGED_BYTES:-524288}"
          viol=0
          for f in $(git diff --name-only --diff-filter=ACM ${range}); do
            [ -f "$f" ] || continue
            sz=$(wc -c < "$f" | tr -d ' ')
            if [ "${sz:-0}" -gt "$max" ]; then
              echo "::error file=$f::staged file exceeds ${max} bytes — likely a bulk export (PII risk in a public repo)"
              viol=$((viol + 1))
            fi
          done
          exit $viol
