# PR gate. Three jobs, split by what they need:
#
#   guard — the structural large-file / bulk-export check. Zero dependencies, so
#           it always runs and is the one meant to be a REQUIRED status check.
#           It is the authoritative half of the pre-commit PII guard, re-run
#           server-side where a local `git commit --no-verify` cannot reach it.
#
#   static — ruff + mypy (tree held at zero; versions pinned in pyproject so
#           a tool release cannot redden an unrelated PR).
#
#   test  — the full suite. Needs the optional extras the suite exercises
#           (`serve` = mcp/starlette, `semantic` = sqlite-vec) plus a git identity
#           for the autosync tests' real commits. Kept separate so the deps-free
#           guard is never blocked by a suite-environment hiccup; promote it to a
#           required check once it is green across a few PRs.
#
# The first attempt installed only `.[dev]` and 23 tests failed on absent extras
# — the suite is not self-contained under dev alone. This installs what it needs.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # full history so the guard can diff the range
      - name: Structural guard over the diff (large-file / bulk-export)
        # Layer 1 of scripts/git-hooks/pre-commit, run authoritatively. Layer 2
        # (user PII regexes) needs the per-machine pattern file, absent in CI, so
        # only the structural half — the half that protects a public repo with no
        # user config, and the half --no-verify was used to skip — runs here.
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if [ -n "$base" ] && [ -n "$head" ]; then
            range="$base..$head"                       # PR: base..head
          else
            range="HEAD~1..HEAD"                        # push: first-parent diff.
            # NOT `git show HEAD` — on a two-parent merge commit (how this repo
            # merges PRs) `git show` prints a combined diff that lists no files,
            # so the guard would pass vacuously on exactly the commits reaching main.
          fi
          max="${ATELIER_MAX_STAGED_BYTES:-524288}"
          viol=0
          # `while IFS= read -r` on a NUL/newline stream, never `for f in $files`:
          # the unquoted expansion word-splits a space-named file into tokens that
          # both fail `[ -f ]`, skipping the very bulk export the guard exists to
          # catch — the fail-open the pre-commit hook is careful to avoid.
          while IFS= read -r f; do
            [ -n "$f" ] && [ -f "$f" ] || continue
            sz=$(wc -c < "$f" | tr -d ' ')
            if [ "${sz:-0}" -gt "$max" ]; then
              echo "::error file=$f::exceeds ${max} bytes — likely a bulk export (PII risk in a public repo)"
              viol=1
            fi
          done < <(git diff --name-only --diff-filter=ACM "$range")
          exit $viol

  static:
    # ruff + mypy. A third required check once green across a few PRs — same
    # promotion path the test job took. Rule-set rationale lives in pyproject.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Same extras as the test job: without them ignore_missing_imports turns
      # starlette/mcp into Any and mypy goes blind to one of the very 13
      # findings this gate exists to catch (PR #112 review, demonstrated).
      - name: Install with the extras mypy needs
        run: pip install -e ".[dev,serve,semantic]"
      - run: ruff check runtime/ tests/ examples/ scripts/
      - run: mypy runtime/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install (with the extras the suite exercises)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,serve,semantic]"
      - name: Git identity (the autosync tests make real commits)
        run: |
          git config --global user.email "ci@atelier.local"
          git config --global user.name "atelier ci"
      - name: Test suite (embeddings off — deterministic, no model download)
        run: ATELIER_EMBED=off python -m pytest -q
