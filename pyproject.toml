[project]
name = "atelier"
version = "0.1.0"
description = "Methodology layer for a sovereign memory system"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "The atelier authors" }]
dependencies = [
    "pyyaml>=6.0",
    # python-frontmatter intentionally omitted — runtime/index/parse.py rolls
    # its own to avoid the dep. Re-add later if we need its plugin model.
    # sqlite3 — stdlib
    # git — shell out via subprocess
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.6",
    "mypy>=1.10",
]
serve = [
    "mcp>=1.0,<2",
    "httpx>=0.28",
]
youtube = [
    "yt-dlp>=2025.1",
    "openai>=1.50",
]
# RFC 0002 P2 — semantic retrieval substrate. Optional by design: without it
# (or without a reachable embedding provider) atelier degrades to lexical-only.
semantic = [
    "sqlite-vec>=0.1.9",
]

[project.scripts]
atelier = "runtime.cli:main"
atelier-mcp-call = "runtime.service.mcp_call:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["runtime*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# F: real defects (unused imports/vars, undefined names). E4/E7/E9: the pycodestyle
# subset that is behavior-adjacent. I: deterministic import order. UP: py311
# modernization (List->list etc). B: bugbear traps. RUF: ruff's own correctness set.
# Deliberately NOT enabled: S (bandit) and BLE — this engine's log-and-continue
# except blocks are a design choice (provider flake tolerance), not oversights.
select = ["F", "E4", "E7", "E9", "I", "UP", "B", "RUF"]
ignore = [
  "B008",    # function call in default arg — argparse/typer-style defaults used deliberately
  "RUF001", "RUF002", "RUF003",  # ambiguous-unicode: Korean prose in docstrings trips these
]

[tool.ruff.lint.per-file-ignores]
# tests monkeypatch and re-import mid-function on purpose
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_strict_optional = true
# Baseline posture: catch real type defects without demanding annotations.
# Tighten module-by-module as the codebase grows types.
check_untyped_defs = true
